name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.9
      - run: gradle setupCIWorkspace build
      - uses: actions/upload-artifact@v4
        with:
          name: colorstorm
          path: build/libs/*.jar
